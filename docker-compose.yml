services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gnkalgo
      POSTGRES_USER: gnkalgo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U gnkalgo"], interval: 5s, timeout: 5s, retries: 10}
    restart: unless-stopped
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
    restart: unless-stopped
  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://gnkalgo:${POSTGRES_PASSWORD}@postgres:5432/gnkalgo
      REDIS_URL: redis://redis:6379/0
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      args: {NEXT_PUBLIC_API_URL: /api/v1}
    depends_on: [api]
    restart: unless-stopped
  nginx:
    image: nginx:1.29-alpine
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
    depends_on: [web, api]
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
