limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
server {
    listen 80;
    server_name gnkalgo.com www.gnkalgo.com localhost;
    client_max_body_size 1m;
    location /api/v1/auth/login { limit_req zone=auth_limit burst=5 nodelay; proxy_pass http://api:8000; include /etc/nginx/proxy_params; }
    location /api/v1/market/stream { proxy_pass http://api:8000; include /etc/nginx/proxy_params; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 3600s; }
    location /api/ { proxy_pass http://api:8000; include /etc/nginx/proxy_params; }
    location /health { proxy_pass http://api:8000; include /etc/nginx/proxy_params; }
    location / { proxy_pass http://web:3000; include /etc/nginx/proxy_params; }
}

server {
    listen 80;
    server_name api.gnkalgo.com;
    client_max_body_size 1m;
    location = /api/v1/auth/login { limit_req zone=auth_limit burst=5 nodelay; proxy_pass http://api:8000; include /etc/nginx/proxy_params; }
    location /api/v1/market/stream { proxy_pass http://api:8000; include /etc/nginx/proxy_params; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 3600s; }
    location / { proxy_pass http://api:8000; include /etc/nginx/proxy_params; }
}
